name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .